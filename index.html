:root {
  --muted: #526979;
  --line: #dce6e9;
  --bg: #f3f6f7;
  --surface: #fff;
  --action: #08786a;
  --focus: #08786a;
  --radius: 10px;
  --shadow: 0 2px 6px #173a5206;
}

:is(button, a, select, input, summary):focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.sidebar {
  background: #102b3e;
  border-right: 1px solid #244356;
  padding-top: 26px;
}

.sidebar :is(button, a):focus-visible { outline-color: #79dfcb; outline-offset: 1px; }
.sidebar .brand { margin-bottom: 27px; }
.sidebar .brand-mark { font-size: 34px; }
.sidebar .brand small { letter-spacing: 1.4px; color: #b3c7d1; }
.sidebar .nav-caption { color: #a0b7c4; letter-spacing: .7px; }
.sidebar .nav-item { min-height: 42px; color: #cedee7; }
.sidebar .nav-item.active { background: #1b685f; color: #fff; box-shadow: none; }
.sidebar .nav-item.active:hover { background: #225e5b; }
.sidebar .nav-divider { background: #ffffff20; margin-top: 11px; margin-bottom: 5px; }
.sidebar-foot { margin-top: auto; flex-shrink: 0; }
.sidebar-foot small { color: #a0b7c4; }
.sidebar-foot .help-link {
  width: 100%;
  min-height: 36px;
  border: 1px solid #3d5c6a;
  border-radius: 6px;
  background: transparent;
  color: #d6e4ed;
  font-size: 12px;
}
.sidebar-foot .help-link:hover { background: #234357; }
.nav-count[hidden] { display: none; }

.topbar { height: 64px; gap: 16px; }
.breadcrumb { min-width: 0; color: var(--muted); gap: 9px; }
.breadcrumb strong { font-weight: 600; color: #294557; }
.top-actions { gap: 10px; }
.assistant-launch { min-height: 36px; font-size: 12px; white-space: nowrap; }
.icon-btn { min-width: 34px; min-height: 34px; color: var(--muted); }
.icon-btn:hover:not(:disabled) { background: #eaf0f2; }

.scope-pill,
.site-status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 10px;
  background: #f6f9fa;
  border: 1px solid #d6e2e7;
  border-radius: 6px;
  color: #405f70;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

.site-status {
  --status-color: #65808e;
  color: #405f70;
}

.site-status[data-state="online"] { --status-color: #169575; color: #176654; }
.site-status[data-state="offline"] { --status-color: #6d8595; }
.site-status[data-state="error"] { --status-color: #b35a28; color: #8c4621; }
.site-status i,
.site-status .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status-color); margin: 0; }

main { padding-top: 28px; }
.page-heading { margin-bottom: 22px; }
.page-heading h1 { font-size: clamp(23px, 2.25vw, 30px); line-height: 1.35; letter-spacing: -.35px; }
.subtitle { color: var(--muted); font-size: 13px; }
.card,
.metric { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.metric-top,
.metric-value small,
.metric-note { color: var(--muted); }
.metric-note { font-size: 11px; }
.card-head h2 { font-size: 15px; }
.card-head p,
.task-copy p,
.legend,
.chart-summary { color: var(--muted); font-size: 11px; }
.small-link,
.row-action { font-size: 12px; color: #087467; }
.btn { min-height: 36px; font-size: 12px; font-weight: 500; }
.btn-primary { background: var(--action); border-color: var(--action); }
.badge.neutral { color: #526979; background: #eff3f5; }
.notice { color: #3f6c64; font-size: 12px; }
.notice.warm { color: #785b31; }
.table-wrap th { color: #4e6878; font-size: 11px; font-weight: 600; }
.chart-svg text { fill: #617985; }

.sync-context { background: #fff; border-color: var(--line); border-radius: var(--radius); }
.sync-context label,
.sync-context-info,
.sync-context-info small,
.sync-lineage dt { color: var(--muted); }
.sync-context label,
.sync-context-info,
.sync-context-info small { font-size: 11px; }
.file-info small,
.map-labels,
.quality-stat,
.detail-description,
.detail-head p,
.anomaly-item p,
.evidence-row > span,
.side-content p,
.report-paper .report-meta,
.report-section p,
.report-section li { color: var(--muted); }
.report-stamp { transform: none; background: #f1f8f5; color: #316e61; }
.page-foot { border-top: 1px solid var(--line); color: #5d7180; font-size: 11px; }

@media (min-width: 761px) and (max-width: 980px) {
  .sidebar-foot .help-link { font-size: 10px; padding: 4px; }
}

@media (max-width: 760px) {
  .sidebar { position: relative; inset: auto; width: auto; display: block; padding: 12px 12px 10px; border: 0; }
  .sidebar .brand { justify-content: flex-start; width: fit-content; margin: 0 0 9px 4px; font-size: 20px; }
  .sidebar .brand > span:last-child { display: block; }
  .sidebar .brand small,
  .sidebar-foot { display: none; }
  .sidebar .brand-mark { font-size: 29px; }
  .sidebar nav { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .sidebar .nav-item {
    justify-content: center;
    flex-direction: column;
    gap: 4px;
    padding: 7px 2px;
    text-align: center;
    font-size: clamp(10px, 2.85vw, 12px);
    line-height: 1.35;
    min-height: 47px;
  }
  .sidebar .nav-item svg { width: 16px; height: 16px; }
  .app-shell { margin-left: 0; }
  .topbar { height: auto; min-height: 52px; flex-wrap: wrap; gap: 6px 10px; padding: 8px 14px; }
  .top-actions { gap: 5px; }
  .scope-pill { display: none; }
  .site-status { font-size: 10px; padding: 4px 6px; }
  main { padding: 18px 14px 0; }
  .sync-context-controls { width: 100%; }
  .toast, .tour { left: 50%; max-width: calc(100vw - 24px); }
  .page-foot { flex-wrap: wrap; padding: 16px 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

function icon(k){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+(paths[k]||paths.info)+'"/></svg>';}

const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const finite=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
const n=(v,d=2)=>finite(v)?Number(v).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const timestamp=v=>v?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(v)):'—';
const issues=()=>D.issues();
const pending=()=>issues().filter(a=>!S.reviewed.has(a.id));
const issueType=a=>({'missing-field':'字段缺失','missing-hours':'小时缺失',duplicate:'重复记录','off-grid':'时间对齐','negative-price':'负电价观察','negative-power':'功率口径'})[a.type]||a.type;
function saveWorkspace(){try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');saved[S.key]={reviewed:[...S.reviewed],anomaly:S.anomaly,validated:S.validated};const keys=Object.keys(saved);keys.slice(0,Math.max(0,keys.length-24)).forEach(k=>delete saved[k]);localStorage.setItem(STORE_KEY,JSON.stringify(saved));}catch(_){}}
function restoreContext(){S.key=D.contextKey;S.reviewed=new Set();S.anomaly='';S.validated=false;S.report=false;S.generatedAt=null;S.filter='all';try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')[S.key];if(saved){const ids=new Set(issues().map(a=>a.id));S.reviewed=new Set((saved.reviewed||[]).filter(id=>ids.has(id)));S.anomaly=ids.has(saved.anomaly)?saved.anomaly:'';S.validated=!!saved.validated;}}catch(_){}S.anomaly=S.anomaly||issues()[0]?.id||'';}
function heading(title,sub,extra=''){return '<div class="page-heading"><div><h1>'+title+'</h1>'+(sub?'<p class="subtitle">'+sub+'</p>':'')+'</div>'+extra+'</div>';}
function metric(label,value,unit,note,k,cl=''){return '<div class="metric '+cl+'"><div class="metric-top">'+label+icon(k)+'</div><div class="metric-value">'+value+'<small>'+unit+'</small></div><div class="metric-note"><span class="dot"></span>'+note+'</div></div>';}
function contextBar(){const c=D.context();return '<section class="sync-context" aria-label="共享分析范围"><div class="sync-context-controls"><label>市场<select id="shared-market" aria-label="共享分析市场">'+D.zones().map(z=>'<option value="'+esc(z.id)+'" '+(z.id===D.zone?'selected':'')+'>'+esc(D.marketName(z.id))+'</option>').join('')+'</select></label><label>交易日<select id="shared-date" aria-label="共享交易日">'+D.dates().map((date,i)=>'<option value="'+date+'" '+(date===D.date?'selected':'')+'>'+date+(i===0?' · 最新数据日':'')+'</option>').join('')+'</select></label></div><div class="sync-context-info"><span class="sync-led"></span><strong>与市场监测同步</strong><small>最近同步 '+esc(timestamp(c.fetchedAt))+'（UTC+8） · '+esc(c.revision||D.revision)+'</small></div></section>'+(D.error?'<div class="notice warm">'+icon('info')+esc(D.error)+'；当前保留最近成功快照。</div>':'');}
function chartMarkup(){
 const points=D.rows();if(!points.length)return '<div class="empty-state">当前交易日暂无市场记录。</div>';
 const w=900,h=275,l=52,r=55,t=25,b=32,prices=points.map(p=>p.price).filter(finite),powers=points.map(p=>p.renewable).filter(finite);
 let low=prices.length?Math.min(...prices):0,high=prices.length?Math.max(...prices):1;const pad=Math.max(1,(high-low)*.12);low-=pad;high+=pad;const maxPower=Math.max(1,...powers);
 const x=i=>l+i/Math.max(1,points.length-1)*(w-l-r),y=v=>t+(high-v)/(high-low)*(h-t-b),yp=v=>h-b-v/maxPower*(h-t-b);
 let path='',open=false;points.forEach((p,i)=>{if(!finite(p.price)){open=false;return;}path+=(open?'L':'M')+x(i).toFixed(2)+','+y(p.price).toFixed(2)+' ';open=true;});
 let grid='';for(let j=0;j<5;j++){const v=low+(high-low)*j/4;grid+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#eaf0f2"/><text x="'+(l-9)+'" y="'+(y(v)+3)+'" text-anchor="end">'+n(v,0)+'</text>';}
 [...new Set([0,Math.floor((points.length-1)*.25),Math.floor((points.length-1)*.5),Math.floor((points.length-1)*.75),points.length-1])].forEach(i=>grid+='<text x="'+x(i)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(D.localTime(points[i].time))+'</text>');
 [0,maxPower/2,maxPower].forEach(v=>grid+='<text x="'+(w-r+9)+'" y="'+(yp(v)+3)+'">'+n(v,0)+'</text>');
 return '<div class="chart-wrap"><svg class="chart-svg" id="main-chart" viewBox="0 0 900 275" role="img" aria-label="'+esc(D.date+' '+D.marketName(D.zone))+'日前电价与区域风光预测，EUR每MWh与MW"><text x="6" y="12">EUR/MWh</text><text x="855" y="12">MW</text>'+grid+points.map((p,i)=>finite(p.renewable)?'<rect x="'+(x(i)-5)+'" y="'+yp(p.renewable)+'" width="10" height="'+(h-b-yp(p.renewable))+'" fill="#dceee6"/>':'').join('')+'<path d="'+path+'" fill="none" stroke="#0b9584" stroke-width="2.5"/><line id="chart-cursor" y1="25" y2="243" stroke="#a3b7bf" stroke-dasharray="3 4" visibility="hidden"/></svg><div class="tooltip" id="chart-tooltip" hidden></div></div>';
}
function fieldsTable(){return '<div class="table-wrap"><table><thead><tr><th>数据字段</th><th>单位</th><th>有效记录</th><th>缺失记录</th><th>覆盖率</th></tr></thead><tbody>'+D.quality().fields.map(f=>'<tr><td>'+esc(f.label)+'</td><td>'+esc(f.unit)+'</td><td>'+n(f.count,0)+'</td><td>'+n(f.missing,0)+'</td><td>'+n(f.coverage*100,1)+'%</td></tr>').join('')+'</tbody></table></div>';}

div><h2>当前范围的数据覆盖</h2><p>与市场监测读取同一批记录；预期 '+q.expectedHours+' 个小时，按实际交易日长度核验。</p></div><button class="small-link" data-go="data">查看数据接入 ↗</button></div>'+fieldsTable()+'</section><div class="notice sync-business-note">'+icon('info')+'场站合同、实际计量与结算账单尚未接入；财务收入和结算差额在接入企业数据后计算。</div>';

 const badge=v=>'<span class="badge '+(S.reviewed.has(v.id)?'':v.informational?'neutral':v.severity)+'">'+(S.reviewed.has(v.id)?'已复核':v.informational?'市场提示':'质量检查')+'</span>';

 const t=D.summary(),q=D.quality(),a=issues(),c=D.context(),strategy=window.VQLab.analyze();
 const observations=finite(t.priceMean)?'日前均价为 '+n(t.priceMean)+' EUR/MWh，最低 '+n(t.priceMin)+'、最高 '+n(t.priceMax)+' EUR/MWh。负价记录共 '+n(t.negativeHours,0)+' 个小时。':'当前范围没有有效日前价格，价格汇总暂不可用。';
 return heading('经营复盘','按当前市场和交易日生成经营报告','<button class="btn btn-primary" id="generate-report">✧ '+(S.report?'重新生成报告':'生成经营报告')+'</button>')+'<div class="report-layout"><article class="card report-paper" id="report-paper"><div class="report-brand"><strong>Volt<span style="font-weight:300">Quant</span><span style="display:block;font-size:7px;margin-top:5px">MARKET · DAILY REVIEW</span></strong><div class="report-stamp">'+(S.report?'已生成 · '+esc(timestamp(S.generatedAt)):'待生成')+'</div></div><h2>市场经营分析日报</h2><div class="report-meta">'+esc(c.market)+' / '+esc(c.date)+' / '+esc(D.revision)+'</div><div class="report-kpis"><div>日前均价 / EUR·MWh⁻¹<strong>'+n(t.priceMean)+'</strong></div><div>平均负荷预测 / MW<strong>'+n(t.loadMean,0)+'</strong></div><div>待复核事项<strong>'+pending().length+' <small style="font-size:10px">项</small></strong></div></div><section class="report-section"><h3>01　市场与经营观察</h3><p>'+observations+'</p><p>平均风光出力预测 '+n(t.renewableMean,0)+' MW，基于有效同小时数据的风光预测占比为 '+(finite(t.renewableShare)?n(t.renewableShare*100,1):'—')+'%。以上为区域系统指标，场站实际发电与财务收入等待企业数据接入。</p></section><section class="report-section"><h3>02　数据核对与处理状态</h3><p>交易日应有 '+q.expectedHours+' 个小时；当前记录 '+q.rows+' 条，缺失 '+q.missingHours+' 个小时、'+q.missingCells+' 个字段值，重复 '+q.duplicates+' 条记录。</p><div class="table-wrap"><table><thead><tr><th>事项</th><th>类型</th><th>状态</th></tr></thead><tbody>'+(a.length?a.map(v=>'<tr><td>'+esc(v.title)+'</td><td>'+esc(issueType(v))+'</td><td>'+(S.reviewed.has(v.id)?'已复核':'待复核')+'</td></tr>').join(''):'<tr><td colspan="3">当前范围未发现质量或负价提示。</td></tr>')+'</tbody></table></div></section><section class="report-section"><h3>03　预测与策略衔接</h3><p>'+(strategy.modelAvailable?'当前交易日有覆盖 '+strategy.periods+' 个有效时段的 CMA-Former 历史留出验证输出，策略页采用同小时 P10 / P50 / P90 价格路径计算情景。':strategy.mode==='sensitivity'?'当前交易日没有完整匹配的模型区间，策略页采用该日真实价格开展敏感性分析。':'当前交易日没有可计算的有效价格，策略页等待价格记录。')+'策略中的资产容量和参与比例为用户假设，情景金额不代表已实现收入。</p><ul>'+a.filter(v=>!S.reviewed.has(v.id)).slice(0,4).map(v=>'<li>'+esc(v.suggestion)+'</li>').join('')+'<li>接入场站合同、计量和结算账单后，补充企业经营及财务核对。</li></ul></section><section class="report-section"><h3>04　数据与计算依据</h3><p>数据来源：ENTSO-E Transparency。获取时间 '+esc(timestamp(c.fetchedAt))+'（UTC+8）。当前分析范围：'+esc(c.market)+'，'+esc(c.date)+'，数据版本 '+esc(D.revision)+'。价格单位 EUR/MWh，负荷与风光预测单位 MW；时间按市场当地交易日归组。</p><p>均价按唯一时间戳首条记录的有效价格计算；风光占比采用有效同小时预测值之和相除。缺失数据保留为空，人工复核状态不修改源数据。</p></section><div class="report-watermark">VOLTQUANT · 市场分析日报 · 辅助决策，人工确认</div></article><div class="report-side"><section class="card side-content"><h3>报告交付</h3><p>'+(S.report?'报告已按当前分析范围和复核状态生成。切换市场、交易日或更新数据后需重新生成。':'先查看当前数据汇总，再生成可下载报告。')+'</p><button class="btn btn-primary" id="download-report" '+(!S.report?'disabled':'')+'>'+icon('download')+' 下载复盘报告</button><button class="btn" id="print-report" '+(!S.report?'disabled':'')+'>'+icon('report')+' 打印 / 保存 PDF</button></section><section class="card side-content"><h3>统一分析范围</h3><p>'+esc(c.market)+'<br>'+esc(c.date)+'<br>'+esc(D.revision)+'</p><p>市场监测、经营四个页面与策略研究共享该范围。</p></section><section class="notice">'+icon('chart')+'将本日观察带入策略情景。<button class="small-link" data-go="lab">前往策略研究 ↗</button></section></div></div>';
}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.vqToastTimer);window.vqToastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
function syncStatus(){
 const status=document.querySelector('.site-status');
 if(D.published){
  status.dataset.state='offline';
  status.querySelector('span').textContent=D.lastSuccessfulUpdate?'最近成功更新：'+timestamp(D.lastSuccessfulUpdate)+'（UTC+8）':'暂无已发布数据';
  return;
 }
 const mode=D.offline?'offline':D.error?'error':D.connected?'online':'offline';
 status.dataset.state=mode;
 status.querySelector('span').textContent=D.offline?'离线快照':D.error?'数据服务暂不可用':D.connected?'数据服务已连接':'等待连接';
}
function render(){
 document.querySelectorAll('[data-view]').forEach(el=>{
  const active=el.dataset.view===S.view;
  el.classList.toggle('active',active);
  if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
 });
 document.getElementById('crumb').textContent=names[S.view];
 document.title=names[S.view]+' · VoltQuant';
 const count=document.querySelector('.nav-count');
 count.textContent=pending().length;
 count.hidden=Number(count.textContent)===0;
 document.querySelector('.scope-pill').textContent=D.marketName(D.zone)+(D.date&&S.view!=='forecast'?' · '+D.date:'');
 syncStatus();
 const renderers={forecast:()=>window.VQForecast.render(),market:()=>window.VQEurope.render(),overview,data:dataView,audit:auditView,report:reportView,lab:()=>window.VQLab.render()};
 const el=document.getElementById('view');el.innerHTML=(S.view==='market'||S.view==='forecast'?'':contextBar())+renderers[S.view]();
 if(S.view==='market')window.VQEurope.bind();if(S.view==='forecast'){window.VQForecast.bind();window.VQEurope.refreshStatus();}if(S.view==='lab')window.VQLab.bind();
 bindChart();updateTour();saveWorkspace();
}
function go(view){if(!Object.hasOwn(names,view))return;if(location.hash!=='#'+view)history.pushState(null,'','#'+view);S.view=view;render();window.scrollTo({top:0,behavior:'instant'});}
function bindChart(){const svg=document.getElementById('main-chart');if(!svg)return;const points=D.rows(),tip=document.getElementById('chart-tooltip'),cursor=document.getElementById('chart-cursor');svg.addEventListener('pointermove',event=>{const rect=svg.getBoundingClientRect(),i=Math.max(0,Math.min(points.length-1,Math.round(((event.clientX-rect.left)/rect.width*900-52)/793*(points.length-1)))),p=points[i];if(!p)return;const x=52+i/Math.max(1,points.length-1)*793;cursor.setAttribute('x1',x);cursor.setAttribute('x2',x);cursor.setAttribute('visibility','visible');tip.hidden=false;tip.innerHTML='<b>'+esc(D.localTime(p.time))+'</b>日前价格　'+n(p.price)+' EUR/MWh<br>负荷预测　'+n(p.load,0)+' MW<br>风光预测　'+n(p.renewable,0)+' MW';tip.style.top='20px';tip.style.left=Math.min(Math.max(8,event.clientX-rect.left+12),rect.width-215)+'px';});svg.addEventListener('pointerleave',()=>{tip.hidden=true;cursor.setAttribute('visibility','hidden');});}
function reset(){D.reset();S.reviewed.clear();S.validated=false;S.report=false;S.generatedAt=null;S.filter='all';S.tour=-1;window.VQLab.reset?.();window.VQForecast.reset?.();closeAssistant();saveWorkspace();go('market');toast('已回到最新市场快照');}
function openCase(id){if(!issues().some(a=>a.id===id))return;S.anomaly=id;S.filter='all';go('audit');}
function exportReport(){const paper=document.getElementById('report-paper');if(!paper||!S.report)return;const css=document.querySelector('head style').textContent;const html='<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoltQuant 市场经营分析日报</title><style>'+css+'body{background:#f3f6f7;padding:35px}.report-paper{max-width:850px;margin:auto}@media print{body{padding:0}}</style><body>'+paper.outerHTML+'</body></html>';const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='VoltQuant-复盘报告-'+D.marketName(D.zone)+'-'+D.date+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('报告已按当前范围导出');}
function assistantMarkup(){return '<div class="assistant-head"><div><h2><span class="spark">✧</span>VoltQuant 数据助手</h2><p>'+esc(D.marketName(D.zone))+' · '+esc(D.date)+'</p></div><button class="icon-btn" id="assistant-close" aria-label="关闭助手">'+icon('close')+'</button></div><div class="assistant-body" id="chat-body"><div class="assistant-welcome"><h3>当前市场分析</h3>可查询数据核对、次日预测、经营报告和策略情景。</div><div class="assistant-suggestions"><button data-prompt="解释当前异常">解释当前事项 ↗</button><button data-prompt="总结当前经营复盘">总结当前日报 ↗</button><button data-prompt="次日电价预测">查看次日预测 ↗</button><button data-prompt="比较三种交易策略">比较策略情景 ↗</button></div><div class="notice">'+icon('info')+'数据版本 '+esc(D.revision)+' · 基于当前数据的规则摘要。</div></div><div class="assistant-bottom"><form class="chat-form" id="chat-form"><input id="chat-input" aria-label="向数据助手提问" placeholder="试试：总结当前市场" autocomplete="off" maxlength="200"><button type="submit" aria-label="发送问题">↑</button></form><small>根据当前页面数据生成摘要</small></div>';}
let lastFocus;
function openAssistant(prompt){lastFocus=document.activeElement;const el=document.getElementById('assistant');el.innerHTML=assistantMarkup();el.hidden=false;document.getElementById('overlay').hidden=false;document.getElementById('chat-input').focus();if(prompt)answer(prompt);}
function closeAssistant(){document.getElementById('assistant').hidden=true;document.getElementById('overlay').hidden=true;if(lastFocus?.isConnected)lastFocus.focus();}
function answer(prompt){const el=document.getElementById('chat-body'),t=D.summary(),a=issues().find(v=>v.id===S.anomaly)||issues()[0];let body,goTo,caseId;
 if(/明日|次日|预测.*对比/.test(prompt)){const p=D.source?.dayAhead||{},r=(p.issues||[]).filter(v=>(v.modelFamily||v.model?.family)==='CMA-Former'&&v.markets?.[D.zone]).sort((a,b)=>String(b.deliveryDate).localeCompare(String(a.deliveryDate)))[0];body='<h4>次日电价预测</h4>'+(r?'当前市场最近一次预测的交付日为 <strong>'+esc(r.deliveryDate)+'</strong>，生成时间 '+esc(timestamp(r.issuedAt))+'（UTC+8）。':'当前市场暂无预测记录。')+'<br><br>预测页提供每小时的 P50、P10—P90 区间及价格公布后的误差分析。';goTo='forecast';}
 else if(/策略|风险|预测|报价/.test(prompt)){const x=window.VQLab.analyze?.();body='<h4>当前范围的策略情景</h4>'+(x?esc(x.modeLabel||x.mode||'价格情景')+'。':'')+'策略页使用同交易日的模型价格路径；没有匹配输出时，使用本日已公布价格做敏感性分析。容量和参与比例由用户设定，金额随真实价格与假设计算。<br><br>请结合合同和资产约束复核后确认。';goTo='lab';}
 else if(/异常|差异|结算|解释|核对|原因/.test(prompt)){body=a?'<h4>'+esc(a.title)+'</h4>'+esc(a.description)+'<br><br><strong>下一步</strong><br>'+esc(a.suggestion):'<h4>当前核对结果</h4>当前市场与交易日没有缺失、重复或负价提示。场站结算差异需要企业账单支持。';goTo='audit';caseId=a?.id;}
 else{body='<h4>'+esc(D.marketName(D.zone))+' · '+esc(D.date)+'</h4>日前均价 <strong>'+n(t.priceMean)+' EUR/MWh</strong>，价格范围 '+n(t.priceMin)+'—'+n(t.priceMax)+' EUR/MWh，负价 '+n(t.negativeHours,0)+' 小时。<br><br>平均负荷预测 '+n(t.loadMean,0)+' MW，平均风光预测 '+n(t.renewableMean,0)+' MW。当前 '+issues().length+' 项提示，'+pending().length+' 项待复核。';goTo='report';}
 el.insertAdjacentHTML('beforeend','<div class="chat-question">'+esc(prompt)+'</div><div class="chat-answer">'+body+'<div class="chat-source" style="margin-top:15px">依据：ENTSO-E · '+esc(D.marketName(D.zone))+' · '+esc(D.date)+' · '+esc(D.revision)+'</div><button class="btn btn-secondary" data-chat-go="'+goTo+'" '+(caseId?'data-chat-case="'+esc(caseId)+'"':'')+'>查看对应分析 '+icon('arrow')+'</button></div>');el.scrollTop=el.scrollHeight;}
const steps=[{view:'overview',title:'经营总览',text:'查看与市场监测一致的价格、负荷与风光预测。'},{view:'data',title:'数据接入',text:'查看真实来源、字段覆盖并记录质量核验状态。'},{view:'audit',title:'核对与异常',text:'复核当前交易日的数据质量问题与市场提示。'},{view:'report',title:'经营复盘',text:'按当前市场、交易日和数据版本生成日报。'},{view:'lab',title:'策略情景',text:'用同日价格路径与资产假设比较候选方案。'}];
function updateTour(){const el=document.getElementById('tour');el.hidden=S.tour<0;document.body.classList.toggle('tour-active',S.tour>=0);if(S.tour<0)return;const t=steps[S.tour];el.innerHTML='<span class="tour-index">'+(S.tour+1)+'</span><div class="tour-copy"><strong>'+t.title+'</strong><p>'+t.text+'</p></div>'+(S.tour>0?'<button id="tour-prev">上一步</button>':'')+'<button id="tour-next">'+(S.tour===4?'完成指引':'下一步 →')+'</button><button class="tour-close" id="tour-close" aria-label="关闭工作流指引">×</button>';}
document.querySelectorAll('[data-icon]').forEach(el=>el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon)));
document.getElementById('reset').innerHTML=icon('refresh');document.getElementById('fullscreen').innerHTML=icon('expand');
document.addEventListener('click',event=>{const t=event.target.closest('button,[data-case]');if(!t)return;if(t.dataset.view)return go(t.dataset.view);if(t.dataset.go)return go(t.dataset.go);if(t.dataset.case)return openCase(t.dataset.case);if(t.dataset.anomaly){S.anomaly=t.dataset.anomaly;render();return;}if(t.dataset.filter){S.filter=t.dataset.filter;render();return;}if(t.dataset.prompt)return answer(t.dataset.prompt);if(t.dataset.chatGo){closeAssistant();return t.dataset.chatCase?openCase(t.dataset.chatCase):go(t.dataset.chatGo);}switch(t.id){case'reload-market':D.refresh().then(()=>toast(D.error?'已保留现有快照':'各页面已读取同一数据快照'));break;case'validate-data':S.validated=true;render();toast('已核验当前版本：'+issues().length+' 项质量或市场提示');break;case'review-anomaly':if(S.reviewed.has(S.anomaly))S.reviewed.delete(S.anomaly);else S.reviewed.add(S.anomaly);S.report=false;render();toast('当前事项复核状态已更新');break;case'explain-anomaly':openAssistant('解释当前异常');break;case'generate-report':S.report=true;S.generatedAt=new Date().toISOString();render();toast('日报已按当前分析范围生成');break;case'download-report':exportReport();break;case'print-report':if(S.report)window.print();break;case'reset':reset();break;case'fullscreen':if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('当前浏览器不支持全屏，可使用 F11'));break;case'assistant-open':openAssistant();break;case'assistant-close':closeAssistant();break;case'tour-side':S.tour=0;go('overview');break;case'tour-next':if(S.tour===4){S.tour=-1;updateTour();}else{S.tour++;go(steps[S.tour].view);}break;case'tour-prev':S.tour=Math.max(0,S.tour-1);go(steps[S.tour].view);break;case'tour-close':S.tour=-1;updateTour();break;}});
document.addEventListener('change',event=>{if(event.target.id==='shared-market')D.setContext(event.target.value,D.date);if(event.target.id==='shared-date')D.setContext(D.zone,event.target.value);});
document.getElementById('overlay').addEventListener('click',closeAssistant);
document.addEventListener('submit',event=>{if(event.target.id==='chat-form'){event.preventDefault();const input=document.getElementById('chat-input'),text=input.value.trim();if(text){input.value='';answer(text);}}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeAssistant();S.tour=-1;updateTour();}if(!document.getElementById('assistant').hidden&&event.key==='Tab'){const all=[...document.getElementById('assistant').querySelectorAll('button,input')].filter(e=>!e.disabled);if(event.shiftKey&&document.activeElement===all[0]){event.preventDefault();all.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===all.at(-1)){event.preventDefault();all[0].focus();}}});
window.addEventListener('hashchange',()=>{const view=location.hash.slice(1)||'market';if(Object.hasOwn(names,view)){S.view=view;render();}});
D.subscribe((store,event)=>{if(event.type==='source'||event.type==='context'){saveWorkspace();restoreContext();closeAssistant();render();}else if(event.type==='status'){syncStatus();if(S.view==='market')window.VQEurope.refreshView?.();else if(S.view==='data')render();}});
document.addEventListener('vq:issue-dayahead',()=>{if(D.loading){window.VQForecast.setBusy?.(false,'快照仍在读取，请稍后重试');return;}window.VQForecast.setBusy?.(true,'正在同步已知数据并生成次日预测…');window.VQEurope.run('forecast').catch(()=>{window.VQForecast.setBusy?.(false,'更新未完成，请重试');});});
document.addEventListener('vq:job-status',event=>{const job=event.detail||{};window.VQForecast?.setBusy?.(!!job.running,job.running?'正在同步数据、生成预测并核对归档…':job.error?'更新未完成，请稍后重试':'');});
window.VQApp={state:S,go,reset,render};restoreContext();const initial=location.hash.slice(1);if(Object.hasOwn(names,initial))S.view=initial;render();D.start();
}());
</script>
